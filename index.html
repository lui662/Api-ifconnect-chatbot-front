<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./style/styles.css">
    <title>ChatBot IFSertao Connect</title>
</head>

<body>
    <nav>
        <div class="nav-container">
            <img src="./img/logo.png" alt="IfSertao PE" class="logo">
            
            <button class="btn-danger" id="btn-apagar" type="button" title="Excluir Histórico">
                <i class="bi bi-trash3"></i> Limpar Chat
            </button>
        </div>
    </nav>

    <main>

        <div id="div-carregando" style="display: none;">
            <i class="bi bi-arrow-repeat girar" style="font-size: 2rem; color: var(--green);"></i>
        </div>

        <div id="historico">
            </div>

    </main>

    <footer>
        <div id="footStyle">
            <input placeholder="Digite sua dúvida aqui..." type="text" name="input" id="inputStyle" autocomplete="off">
            <button id="btn-enviar" class="buttonStyle" onclick="receberMensagem()" type="button">
                <i class="bi bi-send-fill"></i> Enviar
            </button>
        </div>
        <p id="styleCopy">
            &copy; IFSertao Connect - 2025
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module" src="../javascript/script.js"></script>
</body>

</html>
